name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, host tests, pins
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list.outputs.examples }}
    steps:
      # Actions are pinned to commit SHAs; Dependabot proposes updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Tool versions match tools.env
        run: |
          . ./tools.env
          for wf in .github/workflows/ci.yml .github/workflows/release.yml; do
            grep -qF "container: $IDF_IMAGE" "$wf" || { echo "::error file=$wf::container image must be $IDF_IMAGE"; exit 1; }
          done
      - name: Format
        run: |
          pip install --quiet clang-format==18.1.8
          scripts/format.sh --check
      - name: Host unit tests
        run: scripts/test-host.sh
      - name: List examples
        id: list
        run: echo "examples=$(scripts/list-examples.sh | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.example }}
    needs: checks
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.checks.outputs.examples) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build
        shell: bash
        env:
          EXAMPLE: ${{ matrix.example }}
        run: |
          . "$IDF_PATH/export.sh"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/build.sh "$EXAMPLE"
          echo "ARTIFACT=firmware-$(echo "$EXAMPLE" | sed 's|^examples/||; s|/|-|g')" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT }}
          path: out/*.bin
          if-no-files-found: error

  smoke:
    name: Run in esp-emu
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: firmware-*
          path: out
          merge-multiple: true
      - name: Install esp-emu
        run: scripts/install-esp-emu.sh
      - name: Smoke tests
        run: |
          status=0
          for example in $(scripts/list-examples.sh); do
            scripts/smoke.sh "$example" || status=1
          done
          exit $status
