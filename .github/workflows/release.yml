name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.examples }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List examples
        id: list
        run: echo "examples=$(scripts/list-examples.sh | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  # One job per example, in parallel, as in CI. publish only runs if all pass.
  build:
    name: Build ${{ matrix.example }}
    needs: examples
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.examples.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        shell: bash
        env:
          EXAMPLE: ${{ matrix.example }}
        run: |
          . "$IDF_PATH/export.sh"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/build.sh "$EXAMPLE"
          echo "ARTIFACT=firmware-$(echo "$EXAMPLE" | sed 's|^examples/||; s|/|-|g')" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: out/*.bin
          if-no-files-found: error

  parts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The virtual parts for esp-emu (Rust to WebAssembly). The site's
      # emulator loads stackchan-body.wasm from the release.
      - name: Build the parts
        run: |
          . ./tools.env
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          scripts/build-parts.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parts
          path: out/*.wasm
          if-no-files-found: error

  publish:
    needs: [build, parts]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job can create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: firmware-*
          path: out
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parts
          path: out
      - name: Create release with images, parts and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd out
          sha256sum *.bin *.wasm > SHA256SUMS
          gh release create "$TAG" *.bin *.wasm SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
